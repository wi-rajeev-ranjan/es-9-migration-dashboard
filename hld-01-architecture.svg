<rect x="432" y="150" width="368" height="216" rx="9" fill="#E3F0FB" stroke="#2E7CB8" stroke-width="2"/>
<text x="616" y="177" font-size="18" font-weight="700" fill="#12496E" text-anchor="middle">C1 — Candidate ES</text>
<text x="616" y="198" font-size="13.5" fill="#1B5C87" text-anchor="middle">8.10.0 · 12 nodes · Basic licence</text>
<text x="616" y="219" font-size="13.5" fill="#1B5C87" text-anchor="middle">47,093,812 candidates · 436M Lucene docs</text>
<text x="616" y="240" font-size="13.5" fill="#1B5C87" text-anchor="middle">3 pri × (1+2) · 110 GB primary</text>
<text x="616" y="259" font-size="12.5" fill="#8A5A00" text-anchor="middle">+ 90.7M deleted ghosts (~17%)</text>
<rect x="454" y="272" width="324" height="28" rx="5" fill="#CFE6F7"/>
<text x="616" y="291" font-size="13.5" font-weight="700" fill="#12496E" text-anchor="middle">SOURCE OF RECORD · never modified</text>
<text x="616" y="320" font-size="12.5" font-weight="700" fill="#B03A2E" text-anchor="middle">Cannot run the vector spec:</text>
<text x="616" y="338" font-size="12" fill="#8E2A20" text-anchor="middle">no int8_hnsw, no indexed nested dense_vector</text>
<text x="616" y="356" font-size="12" fill="#1B5C87" text-anchor="middle">Serves 100% of production reads</text>

<path fill="none" d="M804,206 L884,206" stroke="#7A4FBF" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#aP)"/>
<text x="844" y="184" font-size="12" font-weight="700" fill="#5B3A94" text-anchor="middle">_reindex</text>
<text x="844" y="169" font-size="11" fill="#5B3A94" text-anchor="middle">ONE-TIME</text>
<text x="844" y="224" font-size="10.5" fill="#5B3A94" text-anchor="middle">in freeze</text>

<path fill="none" d="M804,300 L884,300" stroke="#C0392B" stroke-width="2.5" marker-end="url(#aR)"/>
<text x="844" y="288" font-size="11" font-weight="700" fill="#8E2A20" text-anchor="middle">read-through</text>
<text x="844" y="318" font-size="10.5" fill="#8E2A20" text-anchor="middle">on 404</text>

<rect x="890" y="150" width="378" height="216" rx="9" fill="#E4F5EA" stroke="#37A05F" stroke-width="2"/>
<text x="1079" y="177" font-size="18" font-weight="700" fill="#14562F" text-anchor="middle">C3 — Candidate ES (experiment)</text>
<text x="1079" y="198" font-size="13" fill="#1E6B3E" text-anchor="middle">9.4.2 · Lucene 10 · index: workindia-candidate-feature-embedded</text>
<text x="1079" y="218" font-size="13" fill="#1E6B3E" text-anchor="middle">1 master + 2 coordinators + 3 data nodes</text>
<text x="1079" y="237" font-size="13" fill="#1E6B3E" text-anchor="middle">replicas = 2 (3 copies) · scales out with the cohort</text>
<rect x="912" y="248" width="334" height="26" rx="5" fill="#C9EBD6"/>
<text x="1079" y="266" font-size="13" font-weight="700" fill="#14562F" text-anchor="middle">3M MAU cohort — 100% of the cohort</text>
<text x="1079" y="292" font-size="12.5" fill="#1E6B3E" text-anchor="middle">+ dense_vector context vectors (~3.14/candidate)</text>
<text x="1079" y="311" font-size="12" fill="#B03A2E" text-anchor="middle">index_options immutable — decide quantization before first write</text>
<text x="1079" y="333" font-size="13" font-weight="700" fill="#3D2A63" text-anchor="middle">EXPERIMENT reads only</text>
<text x="1079" y="352" font-size="12" fill="#1E6B3E" text-anchor="middle">6.4% of total corpus — production cutover needs 100%</text>

<text x="850" y="400" font-size="12" font-weight="700" fill="#2E6DB4" text-anchor="middle">dual-write (partial) →  on 404: GET full doc from C1, check MAU predicate, then index into C3</text>

