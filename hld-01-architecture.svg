<text x="844" y="548" font-size="11.5" font-weight="700" fill="#5B3A94" text-anchor="middle">_reindex</text>

<rect x="890" y="500" width="378" height="140" rx="9" fill="#E4F5EA" stroke="#37A05F" stroke-width="2"/>
<text x="1079" y="526" font-size="17" font-weight="700" fill="#14562F" text-anchor="middle">C4 — Jobs ES (required)</text>
<text x="1079" y="548" font-size="13" fill="#1E6B3E" text-anchor="middle">9.4.2 · job context vectors for</text>
<text x="1079" y="567" font-size="13" fill="#1E6B3E" text-anchor="middle">Candidate → Job kNN recall</text>
<text x="1079" y="596" font-size="12.5" font-weight="700" fill="#14562F" text-anchor="middle">Provisioning C4 is a real, uncosted line.</text>

