<text x="616" y="548" font-size="13" fill="#1B5C87" text-anchor="middle">8.6.0 · ~1.5 lakh jobs · 1 pri × (1+5)</text>
<text x="616" y="568" font-size="13" fill="#1B5C87" text-anchor="middle">high QPS · ~300–400 q/s</text>
<rect x="454" y="580" width="324" height="26" rx="5" fill="#CFE6F7"/>
<text x="616" y="598" font-size="13" font-weight="700" fill="#12496E" text-anchor="middle">SOURCE OF RECORD · serves all reads</text>
<text x="616" y="626" font-size="12" fill="#B03A2E" text-anchor="middle">Older than C1 — same categorical blockers</text>

