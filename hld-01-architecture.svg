<text x="50" y="50" font-size="29" font-weight="700" fill="#16324F">ES 9.x Migration — Target Architecture &amp; Data Flow</text>
<text x="50" y="78" font-size="15.5" fill="#5A6B7B">Driver: HNSW / BBQ vector search for semantic matching · 3M MAU cohort migrated first · single consumer writes both clusters · production reads never move</text>
<line x1="50" y1="93" x2="1650" y2="93" stroke="#E3E8EE" stroke-width="2"/>

<!-- LEFT: WRITE PATH -->
<text x="50" y="126" font-size="12.5" font-weight="700" fill="#2E6DB4" letter-spacing="1.5">WRITE PATH</text>
<rect x="50" y="138" width="262" height="72" rx="8" fill="#EEF0F3" stroke="#8A93A0" stroke-width="1.5"/>
<text x="181" y="164" font-size="15.5" font-weight="700" fill="#2B333D" text-anchor="middle">Producing Services (3–4)</text>
<text x="181" y="184" font-size="12.5" fill="#5A6B7B" text-anchor="middle">each owns a different field group</text>
<text x="181" y="201" font-size="12.5" fill="#5A6B7B" text-anchor="middle">DB is the source of truth</text>
<path fill="none" d="M181,210 L181,236" stroke="#2E6DB4" stroke-width="2" marker-end="url(#aB)"/>

<rect x="50" y="238" width="262" height="80" rx="8" fill="#FEF3E0" stroke="#E0912A" stroke-width="1.5"/>
<text x="181" y="263" font-size="16" font-weight="700" fill="#6B4310" text-anchor="middle">Kafka Topic</text>
<text x="181" y="283" font-size="12.5" fill="#7A5520" text-anchor="middle">partitioned by candidate_id</text>
<text x="181" y="301" font-size="12.5" fill="#7A5520" text-anchor="middle">buffers all writes during the freeze</text>
<path fill="none" d="M181,318 L181,344" stroke="#2E6DB4" stroke-width="2" marker-end="url(#aB)"/>

<rect x="50" y="346" width="262" height="150" rx="8" fill="#E7E2F5" stroke="#7A4FBF" stroke-width="2.5"/>
<text x="181" y="372" font-size="15.5" font-weight="700" fill="#3D2A63" text-anchor="middle">SINGLE WRITE CONSUMER</text>
<text x="181" y="391" font-size="12" font-style="italic" fill="#4A3A73" text-anchor="middle">the only writer to either cluster</text>
<line x1="70" y1="400" x2="292" y2="400" stroke="#B9A8DE" stroke-width="1.2"/>
<text x="70" y="419" font-size="12.5" fill="#3D2A63">• dual-write (partial updates OK)</text>
<text x="70" y="438" font-size="12.5" fill="#3D2A63">• read-through backfill on C3 miss</text>
<text x="70" y="457" font-size="12.5" fill="#3D2A63">• re-embedding trigger</text>
<text x="70" y="476" font-size="12.5" fill="#3D2A63">• DLQ + retry on C3 failure</text>
<text x="181" y="518" font-size="11.5" font-style="italic" fill="#8E2A20" text-anchor="middle">consolidating 3–4 writers into one is</text>
<text x="181" y="534" font-size="11.5" font-style="italic" fill="#8E2A20" text-anchor="middle">the enabling change (P1)</text>

<!-- LEFT: READ PATHS -->
<text x="50" y="596" font-size="12.5" font-weight="700" fill="#2E8B57" letter-spacing="1.5">READ PATHS</text>
<rect x="50" y="608" width="262" height="86" rx="8" fill="#F3EEFB" stroke="#7A4FBF" stroke-width="2"/>
<text x="181" y="632" font-size="14.5" font-weight="700" fill="#3D2A63" text-anchor="middle">Semantic Matching Experiment</text>
<text x="181" y="652" font-size="12.5" fill="#4A3A73" text-anchor="middle">Stage 1: filtered kNN on C3</text>
<text x="181" y="670" font-size="12.5" fill="#4A3A73" text-anchor="middle">Stage 2: skills/courses re-scored</text>
<text x="181" y="687" font-size="12" fill="#4A3A73" text-anchor="middle">app-side · own endpoint, not Consul</text>

<rect x="50" y="706" width="262" height="76" rx="8" fill="#EEF0F3" stroke="#8A93A0" stroke-width="1.5"/>
