<rect x="1342" y="277" width="24" height="15" rx="3" fill="#E4F5EA" stroke="#37A05F" stroke-width="1.5"/><text x="1398" y="289" font-size="12.5" fill="#3A4652">New 9.4.2 cluster</text>

<!-- RIGHT: TWO PHASES -->
<rect x="1320" y="324" width="330" height="176" rx="9" fill="#F3EEFB" stroke="#7A4FBF" stroke-width="1.8"/>
<text x="1340" y="349" font-size="12.5" font-weight="700" fill="#3D2A63" letter-spacing="1.2">TWO PHASES</text>
<text x="1340" y="374" font-size="12.5" font-weight="700" fill="#3D2A63">Phase 1 — document migration</text>
<text x="1340" y="392" font-size="12" fill="#4A3A73">_reindex the MAU cohort, then</text>
<text x="1340" y="409" font-size="12" fill="#4A3A73">dual-write keeps both current.</text>
<text x="1340" y="426" font-size="12" font-style="italic" fill="#4A3A73">~8 min at rig throughput.</text>
<text x="1340" y="452" font-size="12.5" font-weight="700" fill="#3D2A63">Phase 2 — embeddings</text>
<text x="1340" y="470" font-size="12" fill="#4A3A73">Separate pipeline. _reindex copies</text>
<text x="1340" y="487" font-size="12" fill="#8E2A20">_source only — NEVER makes vectors.</text>

<!-- RIGHT: GATES -->
<rect x="1320" y="516" width="330" height="230" rx="9" fill="#FDF6EC" stroke="#E0912A" stroke-width="1.8"/>
<text x="1340" y="541" font-size="12.5" font-weight="700" fill="#8A5A00" letter-spacing="1.2">TWO SEPARATE GATES</text>
<text x="1340" y="566" font-size="12.5" font-weight="700" fill="#14562F">A · EXPERIMENT READS (this phase)</text>
<text x="1340" y="585" font-size="12" fill="#3A4652">• MAU cohort 100% present</text>
<text x="1340" y="603" font-size="12" fill="#3A4652">• count parity + sampled diff</text>
<text x="1340" y="621" font-size="12" fill="#3A4652">• embeddings generated + indexed</text>
<text x="1340" y="639" font-size="12" fill="#3A4652">• dual-write error rate = 0</text>
<text x="1340" y="666" font-size="12.5" font-weight="700" fill="#3D2A63">B · PRODUCTION READS (conditional)</text>
<text x="1340" y="685" font-size="12" fill="#3A4652">• ALL 47.1M migrated + ID-set diff</text>
<text x="1340" y="703" font-size="12" fill="#3A4652">• full query parity (nested + synonym)</text>
<text x="1340" y="721" font-size="12" fill="#3A4652">• p99 ≤ baseline at production QPS</text>
<text x="1340" y="739" font-size="12" fill="#3A4652">• alias in place of raw index name</text>

<!-- BOTTOM CONSTRAINT -->
<rect x="410" y="678" width="880" height="90" rx="9" fill="#FDECEA" stroke="#C0392B" stroke-width="1.8"/>
<text x="430" y="702" font-size="13.5" font-weight="700" fill="#8E2A20">WHY THE UPGRADE IS A PREREQUISITE, NOT AN OPTIMISATION  (verified by direct test)</text>
<text x="430" y="724" font-size="12.5" fill="#96372C">8.10.0 rejects int8_hnsw ("Unknown vector index options type") and rejects indexed nested dense_vector ("cannot be indexed if they're within [nested] mappings").</text>
<text x="430" y="742" font-size="12.5" fill="#96372C">The nested restriction is categorical and independent of quantization. int8_hnsw arrived in 8.12, nested kNN in 8.11 — both after the version in production.</text>
<text x="430" y="760" font-size="12.5" fill="#96372C">The sizing document's "ES 8.x with int8_hnsw; no dependency on the 9.x upgrade" holds for 8.x generically, but not for the clusters WorkIndia actually runs.</text>

<!-- BOTTOM FREEZE NOTE -->
<rect x="50" y="900" width="1600" height="76" rx="9" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.6"/>
<text x="70" y="924" font-size="13.5" font-weight="700" fill="#1C4E85">WHY A WRITE FREEZE RATHER THAN A LIVE DELTA-SYNC</text>
<text x="70" y="945" font-size="12.5" fill="#2A5C93">Today 3–4 services each write a different field group to the same document, so no field (including `timestamp`) is reliably updated on every write — there is no application-level change cursor.</text>
<text x="70" y="964" font-size="12.5" fill="#2A5C93">Freezing the single consumer makes C1 consistent for the duration of the copy. `_seq_no` is ES's own per-write counter and is the contingency for copying later batches WITHOUT a freeze — it cannot select the MAU cohort.</text>
</svg>
